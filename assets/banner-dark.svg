  <text x="78" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="-1.2" fill="#efeaff">Victor “Vk” Cavalcante</text>
  <text x="80" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" fill="#b3a9d4">I design products people come back to, and build them in code.</text>
