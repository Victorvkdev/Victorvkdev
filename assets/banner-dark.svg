      <stop offset="100%" stop-color="#0b0914"/>
    </radialGradient>
    <linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#7c5cf0"/></linearGradient>
  </defs>
  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <text x="1150" y="270" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-weight="800" font-size="190" fill="#a78bfa" opacity="0.05">VK</text>
  <rect class="tw tw0" x="820" y="48" width="4" height="4" fill="#a78bfa"/><rect class="tw tw1" x="1010" y="36" width="4" height="4" fill="#a78bfa"/><rect class="tw tw2" x="1120" y="92" width="4" height="4" fill="#a78bfa"/><rect class="tw tw0" x="760" y="120" width="4" height="4" fill="#a78bfa"/><rect class="tw tw1" x="1150" y="210" width="4" height="4" fill="#a78bfa"/><rect class="tw tw2" x="900" y="232" width="4" height="4" fill="#a78bfa"/>
